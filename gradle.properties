# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# The Kotlin compiler runs in its own daemon process (the Gradle default).
#
# This used to say `kotlin.compiler.execution.strategy=in-process` to work
# around "Could not connect to Kotlin compile daemon". Do not put it back.
# In-process means the compiler and KSP share one JVM -- and one copy of the
# IntelliJ-core globals they are both built on -- with the Gradle daemon. When
# that shared state is torn down early (the build log shows
# "ApplicationManager.getApplication() is null" from KSP on the AWT thread),
# the parser loses the virtual file system underneath it and reports syntax
# errors at positions that do not exist in the source. That is what broke the
# v0.0.5 release build with "imports are only allowed in the beginning of
# file" on four perfectly valid files.
#
# The connection failure it was hiding is a memory problem, so the fix is to
# give the Kotlin daemon a heap of its own rather than to remove the process
# boundary. 3g for Kotlin plus 4g for Gradle fits the 16g GitHub runner.
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# Updated settings for secure, clean builds in GitHub Actions.
