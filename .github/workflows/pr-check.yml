# Lightweight health check: does the code still compile, do the unit tests
# still pass, and can both a debug APK and a release APK still be produced?
#
# SECURITY INVARIANT: this workflow must never reference `secrets.*`.
# It runs on untrusted pull-request code, so the safest possible design is for
# it to have nothing to leak. For the same reason it uses `pull_request` and
# never `pull_request_target`, keeps the token read-only, and uploads only
# build reports -- never APKs, never the repository root, never build outputs.
name: PR Check

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"

permissions:
  contents: read

# Superseded runs are cancelled so a burst of pushes costs one build, not five.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Cheap, deterministic guard: fail loudly if a credential file was ever
      # committed, instead of discovering it after the repository goes public.
      - name: Guard against tracked secrets
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env$|(^|/)local\.properties$|\.jks$|\.keystore$|\.p12$|google-services\.json$' || true)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::A credential or signing file is tracked by git. Remove it from the index and rotate the secret."
            exit 1
          fi
          echo "OK: no credential or signing files are tracked."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch is allowed to populate the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # One ordered invocation keeps the runner busy for as short a time as
      # possible and fails fast. No --scan (it would publish build data to a
      # third-party service) and no --info/--debug (they are noisy and can echo
      # environment values into a public log).
      #
      # assembleRelease is here on purpose. The debug variant skips R8 and the
      # release-only compile, so a green debug build is not evidence that a tag
      # will produce a release -- which is exactly how the v0.0.5 tag build
      # failed after the PR was green. No secrets are needed: with no keystore
      # in the environment the release signingConfig stays null (see
      # app/build.gradle.kts) and the APK is simply left unsigned here. Only
      # the tagged release workflow ever signs anything.
      - name: Unit tests, debug build, unsigned release build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          # Reports only. Never app/build/outputs, never the workspace root.
          path: app/build/reports/**
          retention-days: 5
          if-no-files-found: ignore
