name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.0.7). Manual runs never publish a release: the signed APK is attached to the run as an artifact."
        required: true
        default: "0.0.7"
      minify:
        description: "Run R8 code and resource shrinking (off = diagnostic build)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

# Two jobs on purpose.
#
#   build  - sees NO secrets. Everything that executes code pulled from the
#            internet (Gradle plugins, dependencies, KSP, R8) happens here and
#            produces an UNSIGNED APK.
#   sign   - no checkout, no Gradle, no third-party code at all. It downloads
#            that APK, signs it with apksigner from the runner's own SDK,
#            verifies it and publishes it.
#
# A compromised dependency can therefore run with full freedom in `build` and
# still find nothing worth stealing.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Tag pushes are already limited to v* by the trigger. A manual run from
    # any branch other than main would otherwise build - and later sign -
    # whatever that branch happens to contain.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.version.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job may push, so the token must not be left in
          # .git/config where the Gradle build could read it. Release notes
          # are generated server-side by `gh release create --generate-notes`,
          # so the full history (fetch-depth: 0) is no longer needed either.
          persist-credentials: false

      - name: Derive version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="${MANUAL_VERSION#v}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.0.6 (MAJOR.MINOR.PATCH), got '${NAME}'."
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Langosphere $NAME (versionCode $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin

      # `packages: ''` is deliberate. The action's default package list still
      # contains the retired `tools` package, which no longer exists in the
      # Google repository, so sdkmanager exits 1 with "Failed to find package
      # 'tools'" and the whole build dies in under 30 seconds. The runner image
      # already ships platform-tools and build-tools, and Gradle fetches any
      # remaining platform itself, so this step only needs to accept licences
      # and export ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # No KEYSTORE_PATH / passwords in the environment, so app/build.gradle.kts
      # takes its `canSignRelease = false` path and emits app-release-unsigned.apk.
      - name: Build unsigned release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Tag builds always shrink. A manual run can turn shrinking off to
          # isolate an R8 problem.
          ENABLE_MINIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.minify || 'true' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "R8 shrinking: $ENABLE_MINIFY"
          ./gradlew --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PenableMinify="$ENABLE_MINIFY" \
            assembleRelease
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handoff"
          cp "$SRC" "$RUNNER_TEMP/handoff/unsigned.apk"
          echo "Unsigned APK sha256: $(sha256sum "$RUNNER_TEMP/handoff/unsigned.apk" | cut -d' ' -f1)"

      - name: Hand the unsigned APK to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/handoff/unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Write access is granted to this job only, and only to publish.
      contents: write
    # When the signing secrets are ever moved into a GitHub Environment with
    # required reviewers, this single line turns on the approval gate:
    # environment: release

    steps:
      # Deliberately NO actions/checkout here: nothing from the repository
      # runs in the job that holds the key.
      - name: Fetch the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/in

      # $RUNNER_TEMP is outside any workspace, so the keystore cannot be
      # matched by an artifact glob or end up next to the APK output.
      # Nothing derived from the secret is ever printed.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty. Re-create the secret with: base64 -w0 my-upload-key.jks"
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)."

      # Same key, same v2+v3 scheme and v1 disabled, exactly as the Gradle
      # signingConfig did, so installed copies accept the update.
      # Passwords reach apksigner through `env:` so they never appear on a
      # command line.
      - name: Sign and verify
        id: apk
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          IN="$RUNNER_TEMP/in/unsigned.apk"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          OUT="$RUNNER_TEMP/Langosphere-${TAG}.apk"
          [ -s "$IN" ] || { echo "::error::Unsigned APK missing."; exit 1; }
          # AGP already aligns its output; re-align only if the check fails.
          if "$BT/zipalign" -c 4 "$IN"; then cp "$IN" "$ALIGNED"; else "$BT/zipalign" -f 4 "$IN" "$ALIGNED"; fi
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "Signed APK sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # Runs even when signing fails, so the key never outlives the job.
      - name: Destroy the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"

      # `gh release create` uploads the asset to a draft and publishes in one
      # go, which is what immutable releases require (assets cannot be added
      # to a release after it is published). --verify-tag refuses to invent a
      # tag that does not already exist on the remote. Notes honour
      # .github/release.yml. No mapping.txt is published: R8 no longer renames
      # anything (see app/proguard-rules.pro).
      - name: Publish the GitHub release (tag builds only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Langosphere $TAG" \
            --generate-notes \
            --latest

      # A manual run is a diagnostic build. It is never published as a
      # release (so it can never become "Latest" and be offered to users by
      # the in-app updater); the signed APK is attached to the run instead.
      - name: Attach the diagnostic APK to this run (manual builds only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Langosphere-${{ needs.build.outputs.tag }}-diagnostic
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
