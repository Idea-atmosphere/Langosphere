name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.0.8)"
        required: true
      mode:
        description: "draft = build, sign and put the APK into a DRAFT release v<version> that you then publish from the Releases page. artifact = diagnostic build attached to this run only, never published."
        type: choice
        options: ["draft", "artifact"]
        default: "draft"
      minify:
        description: "Run R8 code and resource shrinking (artifact mode only; drafts always shrink)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

# Releases in this repository are IMMUTABLE: once a release is published, no
# file can be added to it and its tag can never be reused. The APK therefore
# has to be in place BEFORE the release is published, which gives three
# entry points:
#
#   Run workflow, mode=draft  (the normal way, from the website)
#       Builds main, signs, and creates a draft release v<version> with the
#       APK attached, pinned to the exact commit that was built. Nothing is
#       public yet. You open the draft, write the notes, click Publish; that
#       creates the tag and seals the release. If you made the draft yourself
#       first (Save draft), the APK is attached to that draft instead.
#
#   Tag push  (git / API users)
#       `gh release create` uploads the APK to a draft and publishes it in
#       one go. When the tag was created by clicking Publish on a draft that
#       already carries its APK, this run notices and does nothing.
#
#   Run workflow, mode=artifact
#       Diagnostic build. The signed APK is attached to the run as an
#       artifact and can never become "Latest" for the in-app updater.
#
# GitHub does not run workflows for draft-release events, so the draft path
# has to be started by hand.

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Three jobs on purpose.
#
#   plan   - no checkout, no third-party code: derives the version and decides
#            whether this run publishes, fills a draft, attaches an artifact
#            or has nothing to do.
#   build  - sees NO secrets. Everything that executes code pulled from the
#            internet (Gradle plugins, dependencies, KSP, R8) happens here and
#            produces an UNSIGNED APK.
#   sign   - no checkout, no Gradle, no third-party code at all. It downloads
#            that APK, signs it with apksigner from the runner's own SDK,
#            verifies it and publishes it.
#
# A compromised dependency can therefore run with full freedom in `build` and
# still find nothing worth stealing.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tag pushes are already limited to v* by the trigger. A manual run from
    # any branch other than main would otherwise build - and later sign -
    # whatever that branch happens to contain.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      action: ${{ steps.plan.outputs.action }}
      name: ${{ steps.plan.outputs.name }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}

    steps:
      - name: Derive version and decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="${MANUAL_VERSION#v}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.0.8 (MAJOR.MINOR.PATCH), got '${NAME}'."
            exit 1
          fi
          TAG="v$NAME"
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_MODE" = "draft" ]; then ACTION=draft; else ACTION=artifact; fi
          else
            # Is there already a PUBLISHED release for this tag? (Drafts are
            # not returned by this endpoint, and they do not own a tag anyway.)
            set +e
            EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>"$RUNNER_TEMP/api.err")"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              APKS="$(printf '%s' "$EXISTING" | jq -r '[.assets[].name | select(test("\\.apk$"; "i"))] | length')"
              if [ "$APKS" -gt 0 ]; then
                # The tag was created by clicking Publish on a draft that
                # already carries its APK. Nothing left to do.
                echo "::notice title=Already published::$TAG is published with its APK. Nothing to do."
                ACTION=skip
              else
                echo "::error title=Release without APK::A release for $TAG is already published but has no APK. Releases here are immutable, so the file can no longer be added and the tag name cannot be reused. Use the next version number and run this workflow with mode=draft; publish the draft only after the APK shows up under Assets."
                exit 1
              fi
            elif grep -qi "Not Found" "$RUNNER_TEMP/api.err"; then
              ACTION=publish
            else
              cat "$RUNNER_TEMP/api.err"
              exit 1
            fi
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Langosphere $NAME (versionCode $CODE): $ACTION"

  build:
    needs: plan
    if: needs.plan.outputs.action != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.built.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job may push, so the token must not be left in
          # .git/config where the Gradle build could read it. Release notes
          # are generated server-side by `gh release create --generate-notes`,
          # so the full history (fetch-depth: 0) is no longer needed either.
          persist-credentials: false

      # A draft is pinned to this commit, so the tag that Publish creates
      # later points at exactly what was built, even if main moves meanwhile.
      - name: Record the commit being built
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin

      # `packages: ''` is deliberate. The action's default package list still
      # contains the retired `tools` package, which no longer exists in the
      # Google repository, so sdkmanager exits 1 with "Failed to find package
      # 'tools'" and the whole build dies in under 30 seconds. The runner image
      # already ships platform-tools and build-tools, and Gradle fetches any
      # remaining platform itself, so this step only needs to accept licences
      # and export ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # No KEYSTORE_PATH / passwords in the environment, so app/build.gradle.kts
      # takes its `canSignRelease = false` path and emits app-release-unsigned.apk.
      - name: Build unsigned release APK
        env:
          APP_VERSION_NAME: ${{ needs.plan.outputs.name }}
          APP_VERSION_CODE: ${{ needs.plan.outputs.code }}
          # Anything that can be published (tag builds, drafts) always
          # shrinks. Only a diagnostic artifact build can turn R8 off.
          ENABLE_MINIFY: ${{ needs.plan.outputs.action == 'artifact' && inputs.minify || 'true' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "R8 shrinking: $ENABLE_MINIFY"
          ./gradlew --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PenableMinify="$ENABLE_MINIFY" \
            assembleRelease
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/handoff"
          cp "$SRC" "$RUNNER_TEMP/handoff/unsigned.apk"
          echo "Unsigned APK sha256: $(sha256sum "$RUNNER_TEMP/handoff/unsigned.apk" | cut -d' ' -f1)"

      - name: Hand the unsigned APK to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/handoff/unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Write access is granted to this job only, and only to publish.
      contents: write
    # When the signing secrets are ever moved into a GitHub Environment with
    # required reviewers, this single line turns on the approval gate:
    # environment: release

    steps:
      # Deliberately NO actions/checkout here: nothing from the repository
      # runs in the job that holds the key.
      - name: Fetch the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/in

      # $RUNNER_TEMP is outside any workspace, so the keystore cannot be
      # matched by an artifact glob or end up next to the APK output.
      # Nothing derived from the secret is ever printed.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty. Re-create the secret with: base64 -w0 my-upload-key.jks"
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)."

      # Same key, same v2+v3 scheme and v1 disabled, exactly as the Gradle
      # signingConfig did, so installed copies accept the update.
      # Passwords reach apksigner through `env:` so they never appear on a
      # command line.
      - name: Sign and verify
        id: apk
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          IN="$RUNNER_TEMP/in/unsigned.apk"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          OUT="$RUNNER_TEMP/Langosphere-${TAG}.apk"
          [ -s "$IN" ] || { echo "::error::Unsigned APK missing."; exit 1; }
          # AGP already aligns its output; re-align only if the check fails.
          if "$BT/zipalign" -c 4 "$IN"; then cp "$IN" "$ALIGNED"; else "$BT/zipalign" -f 4 "$IN" "$ALIGNED"; fi
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "Signed APK sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # Runs even when signing fails, so the key never outlives the job.
      - name: Destroy the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"

      # `gh release create` uploads the asset to a draft and publishes in one
      # go, which is what immutable releases require (assets cannot be added
      # to a release after it is published). --verify-tag refuses to invent a
      # tag that does not already exist on the remote. Notes honour
      # .github/release.yml. No mapping.txt is published: R8 no longer renames
      # anything (see app/proguard-rules.pro).
      - name: Publish the GitHub release (tag builds only)
        if: needs.plan.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Langosphere $TAG" \
            --generate-notes \
            --latest

      # The website path. A draft owns no tag and is not immutable yet, so the
      # APK can be attached now and the release published later by a human.
      # Publishing creates the tag at --target, i.e. at the commit that was
      # actually built. `gh` finds drafts by their pending tag name, so a
      # draft you saved yourself beforehand is filled instead of duplicated.
      - name: Put the APK into a draft release (manual draft mode only)
        if: needs.plan.outputs.action == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>"$RUNNER_TEMP/view.err")"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            if [ "$(printf '%s' "$INFO" | jq -r '.isDraft')" != "true" ]; then
              echo "::error title=Already published::$TAG is already published. Releases here are immutable, so the APK can no longer be added and the tag name cannot be reused. Run again with the next version number."
              exit 1
            fi
            echo "Draft $TAG already exists: attaching the APK and pinning it to $SHA."
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA"
          elif grep -qi "not found" "$RUNNER_TEMP/view.err"; then
            echo "Creating draft $TAG at $SHA."
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$SHA" \
              --title "Langosphere $TAG" \
              --generate-notes \
              --latest
          else
            cat "$RUNNER_TEMP/view.err"
            exit 1
          fi
          echo "::notice title=Draft ready::$TAG is a draft with $(basename "$APK") attached. Open Releases, check the file under Assets, write the notes and click Publish release."

      # A manual run is a diagnostic build. It is never published as a
      # release (so it can never become "Latest" and be offered to users by
      # the in-app updater); the signed APK is attached to the run instead.
      - name: Attach the diagnostic APK to this run (manual artifact mode only)
        if: needs.plan.outputs.action == 'artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Langosphere-${{ needs.plan.outputs.tag }}-diagnostic
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
